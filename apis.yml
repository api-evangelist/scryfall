apis:
  - aid: scryfall:scryfall-api
    name: Scryfall API
    description: >-
      The Scryfall REST API exposes Magic - The Gathering card data, set metadata, Oracle rulings, symbology, catalogs
      of in-game data points, daily bulk-data exports, and card-object migration records. The Cards surface alone
      supports lookup by Scryfall ID, set+number, Multiverse ID, MTGO ID, Arena ID, TCGplayer ID, Cardmarket ID,
      exact/fuzzy name, autocomplete, random draw, and batch collection. All responses use a discriminated object model
      keyed by the 'object' field.
    humanURL: https://scryfall.com/docs/api
    baseURL: https://api.scryfall.com
    tags:
