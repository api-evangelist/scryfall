aid: scryfall
name: Scryfall
description: >-
  Scryfall is the most comprehensive free Magic - The Gathering card database. The Scryfall API exposes Cards (search,
  autocomplete, named, random, collection, by various IDs), Sets, Rulings, Symbology, Catalogs, Bulk Data downloads, and
  card-object Migrations. The service is community-funded (Patreon / Ko-fi) and offered free of charge under the Wizards
  of the Coast Fan Content Policy for community software, research, and content. The API is HTTPS-only, requires a
  descriptive User-Agent and Accept header on every request, and asks that clients keep sustained traffic under 10
  requests per second.
